<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outbreak Investigation Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root{--ink:#14242b;--field:#2f5d50;--paper:#eef1ec;--card:#fff;--line:#c7d0ca;--sig:#e0a100;--bad:#b3402f;--mute:#5d6c68}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
h1,h2{font-family:Georgia,serif;margin:0}
header{display:flex;align-items:center;gap:20px;padding:10px 18px;background:var(--ink);color:#eef1ec;flex-wrap:wrap}
header h1{font-size:19px}.sub{color:#9fb3ad;font-size:13px}
.trust{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.bar{width:180px;height:12px;background:#33454c;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sig);transition:width .5s,background .5s}
button{font:inherit;cursor:pointer}
.btn{background:var(--field);color:#fff;border:0;border-radius:6px;padding:7px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
aside h2{font-size:15px;margin-bottom:6px}
.loc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin-bottom:5px}
.loc:disabled{opacity:.55;cursor:not-allowed}.loc small{display:block;color:var(--mute)}.loc.on{border-color:var(--field);box-shadow:inset 4px 0 0 var(--field)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#dfe9e4;border-radius:4px;padding:2px 8px;font-size:13px}.tag.rh{background:#f1ddd8;color:var(--bad)}
#graph{height:210px;background:var(--card);border:1px solid var(--line);border-radius:6px}
section.dlg{display:flex;flex-direction:column;min-height:0}
.who{display:flex;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto;background:#e4eae6}
.who button{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px;white-space:nowrap}
.who button.on{box-shadow:0 0 0 2px var(--field)}
.av{width:30px;height:30px;border-radius:50%;background:var(--field);color:#fff;display:grid;place-items:center;font-size:13px;object-fit:cover}
#log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:640px;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.m.u{align-self:flex-end;background:var(--field);color:#fff;border-color:var(--field)}
.m .n{font-size:12px;color:var(--mute)}
.sys{align-self:center;font-size:13px;color:var(--mute);text-align:center;max-width:560px}.sys.bad{color:var(--bad)}.sys.good{color:var(--field)}
#chips{display:flex;gap:8px;padding:0 18px 8px;flex-wrap:wrap;max-height:34vh;overflow:auto}
.chip{background:var(--card);border:1px solid var(--field);border-radius:8px;padding:6px 10px;text-align:left;font-size:14px;flex:1 1 230px}
.chip b{display:block;font-size:12px;color:var(--field)}.chip.empathy{border-color:#a67c00}.chip.empathy b{color:#a67c00}.chip.direct{border-color:var(--bad)}.chip.direct b{color:var(--bad)}
.chip:hover{background:#e4eae6}
form.row{display:flex;gap:8px;padding:10px 18px 16px;margin:0}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:100%}
dialog{border:0;border-radius:10px;padding:22px;max-width:560px;width:94%;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(20,36,43,.6)}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
.ck{display:flex;gap:8px;align-items:flex-start;margin:4px 0;color:var(--ink)}.ck input{width:auto;margin-top:5px}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:#f3f6f4;padding:12px;border-radius:6px}
@media(max-width:800px){body{height:auto}main{grid-template-columns:1fr}aside{border-right:0}#log{min-height:50vh}.bar{width:100px}}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
</style></head>
<body>
<header><div><h1>Outbreak Investigation Simulator</h1><div class="sub" id="cn"></div></div>
<div class="trust">Village trust <div class="bar"><i id="tb"></i></div><b id="tv"></b></div></header>
<main>
<aside>
 <div><h2>Locations</h2><div id="locs"></div></div>
 <div><h2>Evidence notebook</h2><div class="tags" id="ev"></div></div>
 <div><h2>Contact tracing</h2><div id="graph"></div></div>
 <button class="btn" id="rb" disabled>Give final verdict</button>
 <div class="sub" id="gate" style="color:var(--mute)"></div>
</aside>
<section class="dlg"><div class="who" id="who"></div><div id="log"></div><div id="chips"></div>
<form class="row" id="f"><input id="txt" placeholder="Or type your own question…" autocomplete="off"><button class="btn">Send</button></form></section>
</main>

<dialog id="rd"><h2>Final verdict</h2>
<p class="sub" style="color:var(--mute)">Write in your own words. Be specific.</p>
<label>1. Your diagnosis: pathogen and category</label><textarea id="r1" rows="2"></textarea>
<label>2. Source and route of transmission (how it spread)</label><textarea id="r2" rows="3"></textarea>
<label>3. Containment plan for Dr. Verma</label><textarea id="r3" rows="5"></textarea>
<p><button class="btn" id="sub">Submit verdict</button> <button class="btn" style="background:#6b7a76" onclick="rd.close()">Cancel</button></p>
<pre id="card" hidden></pre></dialog>

"doctor":{"name":"Dr. Sharma","role":"Treating Doctor","location":"Community Health Center","portrait":"assets/images/doctor.png",

 {"id":"d5","style":"clinical","label":"When did symptoms start? What's the timeline?","keys":["incubation","when","onset","days","timeline","start"],"reply":"Fever began about 5 days ago. Ramesh says it came a few days after something he hasn't fully described to me.","ev":[["#Incubation_5Days","Onset about 5 days after exposure"]]},

 {"id":"a2","style":"clinical","label":"Could the sugarcane pesticide spray be the cause?","keys":["pesticide","spray","sugarcane","poison","chemical"],"reply":"The spray was three weeks ago. Farmhands and cattle are fine. Only a few people are sick, and not all of them farm.","ev":[["#RedHerring_Pesticide","Spray timing and spread don't fit"]]},

 {"id":"b8","style":"empathy","label":"Ask for his blessing and help to reach hidden families","keys":["bless","blessing","help","reach","hidden","east","families"],"reply":"Go with my blessing. I will send word to the east hamlet. Let the sick come to the clinic, and I will pray for them.","trust":5,"needs":{"topics":["b4"]},"ev":[["#HiddenCasesComing","Baba will refer hidden families"]]}]}},
"gate":{"links":3,"vectorTags":["#RawDatePalmSap","#FruitBatRoost"]},
"report":{"pathogen":"nipah|henipa","sap":"sap|toddy|date palm","bat":"\\bbats?\\b|flying fox",
 "plan":[
  {"t":"Ban or avoid raw sap; advise boiling or discarding","all":["sap|toddy","ban|stop|avoid|prohibit|boil|discourage|discard"]},
  {"t":"Cover sap pots/trees with bamboo skirts or nets against bats","all":["skirt|net|cover|barrier|bamboo|shield","sap|pot|palm|tree"]},
  {"t":"Isolate cases and trace contacts, including hidden cases","all":["isolat|quarantin","trac|contact|east|hidden"]},
  {"t":"Infection control and PPE for health workers and caregivers","all":["ppe|mask|glove|infection control|barrier nursing|protective"]},
  {"t":"Community engagement with Baba, Rani and families","all":["baba|asha|rani|communit|awareness|educat|messag|trust"]}],
 "harm":[{"t":"Culling or killing bats","all":["cull|kill|destroy|eradicat","\\bbats?\\b"]},{"t":"Spraying insecticide as the main response","all":["spray|fumigat","insecticid|pesticid"]}],
 "required":["#Encephalitis","#NonBacterial","#RawDatePalmSap","#FruitBatRoost","#RedHerring_WaterPump","#HiddenCases","#BodyFluidExposure"]}}
</script>
<script>
const $=s=>document.querySelector(s),rd=$('#rd');
const S={trust:60,ev:[],asked:new Set(),chat:{},npc:null,over:false,min:60,done:false,flags:new Set(),loc:null};
const RUDE=/\b(stupid|idiot|fool|liar|useless|shut up|kill|damn|moron)\b/i;
async function load(){
 const id=new URLSearchParams(location.search).get('case')||'case-01';
 try{S.c=await(await fetch('data/'+id+'.json')).json()}catch(e){S.c=JSON.parse($('#emb').textContent)}
 const c=S.c;S.trust=S.min=c.start.trust;$('#cn').textContent=c.case_title+' · '+c.location_name;
 S.nodes=new vis.DataSet(c.start.nodes);S.edges=new vis.DataSet();
 new vis.Network($('#graph'),{nodes:S.nodes,edges:S.edges},{nodes:{shape:'box',color:{background:'#dfe9e4',border:'#2f5d50'},font:{size:13},margin:6},edges:{arrows:'to',color:'#5d6c68'}});
 renderLocs();
 trust(0);renderEv();goLoc(S.c.start.location);
 sysTo('__intro',c.intro);
}
function sysTo(k,t,cls){(S.chat[k]=S.chat[k]||[]).push({role:'sys',text:t,cls});if(k===S.npc||k==='__intro')bubble({role:'sys',text:t,cls})}
const unmet=l=>((l&&l.flags)||[]).some(f=>!S.flags.has(f));
function renderLocs(){
 $('#locs').innerHTML=Object.entries(S.c.locations).map(([l,o])=>{const lk=unmet(o.lock);return `<button class="loc ${l===S.loc?'on':''}" data-l="${l}" ${lk?'disabled':''}>${lk?'🔒 ':''}${l}${lk?'<small>'+o.lock.msg+'</small>':''}</button>`}).join('');
 document.querySelectorAll('.loc').forEach(b=>b.onclick=()=>goLoc(b.dataset.l));
}
function renderWho(){
 const list=Object.entries(S.c.npcs).filter(([,n])=>n.location===S.loc);
 $('#who').innerHTML=list.map(([k,n])=>`<button data-k="${k}" class="${k===S.npc?'on':''}">${unmet(n.lock)?'🔒 ':''}${av(n)}${n.name}</button>`).join('');
 document.querySelectorAll('#who button').forEach(b=>b.onclick=()=>open(b.dataset.k));
}
function goLoc(l){S.loc=l;S.npc=null;renderLocs();renderWho();open(Object.keys(S.c.npcs).find(k=>S.c.npcs[k].location===l))}
function av(n){const i=n.name.split(' ').map(w=>w[0]).slice(0,2).join('');return `<img class="av" src="${n.portrait}" alt="" onerror="this.outerHTML='<span class=&quot;av&quot;>${i}</span>'">`}
const vec=()=>S.c.gate.vectorTags.some(t=>S.ev.some(e=>e[0]===t));
const gateOk=()=>S.edges.length>=S.c.gate.links&&vec();
function open(k){
 S.npc=k;renderWho();const n=S.c.npcs[k];S.chat[k]=S.chat[k]||[];
 if(unmet(n.lock)){$('#log').innerHTML='';bubble({role:'sys',text:n.lock.msg});$('#chips').innerHTML='';return}
 if(!S.chat[k].length)S.chat[k].push({role:'npc',text:n.greet});
 $('#log').innerHTML='';S.chat[k].forEach(bubble);chips();
}
function bubble(m){
 const d=document.createElement('div');
 if(m.role==='sys'){d.className='sys '+(m.cls||'');d.textContent=m.text}
 else{d.className='m '+(m.role==='user'?'u':'');d.innerHTML=(m.role==='npc'?`<div class="n">${S.c.npcs[S.npc].name}</div>`:'')+'<span></span>';d.lastChild.textContent=m.text}
 $('#log').appendChild(d);$('#log').scrollTop=1e9;
}
function say(role,text,cls){const m={role,text,cls};S.chat[S.npc].push(m);bubble(m)}
function chips(){
 const n=S.c.npcs[S.npc],left=S.over?[]:n.topics.filter(t=>!S.asked.has(t.id));
 $('#chips').innerHTML=left.map(t=>`<button class="chip ${t.style}" data-i="${t.id}"><b>${t.style[0].toUpperCase()+t.style.slice(1)}</b>${t.label}</button>`).join('');
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>run(n.topics.find(t=>t.id===b.dataset.i),true));
}
$('#f').onsubmit=e=>{e.preventDefault();const v=$('#txt').value.trim().toLowerCase();if(!v||S.over)return;$('#txt').value='';
 const n=S.c.npcs[S.npc];if(unmet(n.lock))return;
 say('user',v);
 if(RUDE.test(v)){say('npc','Watch your tone. I will not be spoken to like that.');trust(-8,'Rude remark');chips();return}
 let best=null,bs=0;n.topics.filter(t=>!S.asked.has(t.id)).forEach(t=>{const s=t.keys.filter(k=>v.includes(k)).length;if(s>bs){bs=s;best=t}});
 best?run(best,false):(say('npc',n.fallback),chips())};
function run(t,show){
 const n=S.c.npcs[S.npc];if(show)say('user',t.label);
 const nd=t.needs||{};
 if((nd.trust&&S.trust<nd.trust)||(nd.flags||[]).some(x=>!S.flags.has(x))||(nd.topics||[]).some(x=>!S.asked.has(x))||(nd.ev||[]).some(x=>!S.ev.some(e=>e[0]===x))){say('npc',n.guarded);chips();return}
 S.asked.add(t.id);say('npc',t.reply);(t.set||[]).forEach(f=>{if(!S.flags.has(f)){S.flags.add(f);say('sys',S.c.unlock[f]||'','good')}});
 if(t.trust)trust(t.trust);
 (t.ev||[]).forEach(([tag,note])=>{if(!S.ev.some(e=>e[0]===tag)){S.ev.push([tag,note]);say('sys','Logged '+tag,tag.includes('RedHerring')?'bad':'good')}});
 (t.contacts||[]).forEach(c=>{const ex=S.nodes.get(c.id);ex?S.nodes.update({id:c.id,label:c.label}):S.nodes.add({id:c.id,label:c.label});
  if(c.from&&!S.edges.get({filter:e=>e.from===c.from&&e.to===c.id}).length){S.edges.add({from:c.from,to:c.id});say('sys','Contact graph updated: '+c.label,'good')}});
 renderEv();renderLocs();renderWho();chips();
}
function trust(d,why){
 S.trust=Math.max(0,Math.min(100,S.trust+d));S.min=Math.min(S.min,S.trust);
 if(d){say('sys',`Village trust ${d>0?'+':''}${d}${why?' ('+why+')':''}`,d<0?'bad':'good')}
 $('#tb').style.width=S.trust+'%';$('#tb').style.background=S.trust<30?'var(--bad)':'var(--sig)';$('#tv').textContent=S.trust+'%';
 if(S.trust<=0&&!S.over){S.over=true;say('sys','Game over: villagers refuse to talk and are hiding the sick. The investigation has failed.','bad');$('#rb').disabled=true}
}
function renderEv(){
 $('#ev').innerHTML=S.ev.length?S.ev.map(e=>`<span class="tag ${e[0].includes('RedHerring')?'rh':''}" title="${e[1]}">${e[0]}</span>`).join(''):'<span class="sub" style="color:var(--mute)">Nothing logged yet.</span>';
 const ok=gateOk()&&S.flags.has('permission')&&!S.over;$('#rb').disabled=!ok;
 $('#gate').textContent=ok?'Ready: return to the District Office to give your verdict.':`Verdict locked: ${S.edges.length}/${S.c.gate.links} linked contacts, vector ${vec()?'found':'not found'}.`;
}
/* ---------- Typed verdict + keyword auto-grading ---------- */
const T=(s,all)=>all.every(p=>new RegExp(p,'i').test(s));
$('#rb').onclick=()=>{if(S.loc!==S.c.start.location){$('#gate').textContent='Travel to the District Office to give your verdict.';return}
 $('#card').hidden=true;$('#sub').disabled=false;rd.showModal()};
$('#sub').onclick=()=>{
 const r=S.c.report,a=$('#r1').value+' '+$('#r2').value,p=$('#r3').value,rx=k=>new RegExp(k,'i').test(a);
 if(a.trim().length<15||p.trim().length<15){$('#card').textContent='Please write your diagnosis, route and plan first.';$('#card').hidden=false;return}
 const nip=rx(r.pathogen),sap=rx(r.sap),bat=rx(r.bat),diag=(nip?20:rx('virus|viral')?6:0)+(sap?10:0)+(bat?10:0);
 const have=r.required.filter(t=>S.ev.some(e=>e[0]===t)),miss=r.required.filter(t=>!have.includes(t));
 const meth=Math.round(20*have.length/r.required.length);
 const rap=Math.max(0,Math.min(15,Math.round(15*S.trust/S.c.start.trust)-(S.min<S.c.start.trust*.5?3:0)));
 const hit=r.plan.filter(x=>T(p,x.all)),no=r.plan.filter(x=>!hit.includes(x)),harm=r.harm.filter(x=>T(p,x.all));
 const con=Math.max(0,hit.length*5-harm.length*5);
 const sum=diag+meth+rap+con,L=sum>=90?'A':sum>=80?'B':sum>=70?'C':sum>=60?'D':'F';
 $('#card').textContent=`EPIDEMIOLOGY FIELD REPORT CARD\nFINAL GRADE: ${L} (${sum}/100)\n\nDIAGNOSIS: ${diag}/40\n- Pathogen named: ${nip?'yes':'not clearly'}\n- Raw sap as source: ${sap?'yes':'missing'}\n- Fruit bats as reservoir: ${bat?'yes':'missing'}\n\nINVESTIGATION METHOD: ${meth}/20\n- Key evidence: ${have.length}/${r.required.length}${miss.length?'\n- Missed: '+miss.join(', '):''}\n\nCOMMUNITY RAPPORT: ${rap}/15\n- Final trust ${S.trust}%, lowest ${S.min}%\n\nCONTAINMENT PLAN: ${con}/25\n- Covered: ${hit.map(x=>x.t).join('; ')||'none'}${no.length?'\n- Consider adding: '+no.map(x=>x.t).join('; '):''}${harm.length?'\n- Harmful: '+harm.map(x=>x.t).join('; '):''}`;
 $('#card').hidden=false;$('#sub').disabled=true;
};
load();
</script></body></html>
